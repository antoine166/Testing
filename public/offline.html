<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Life OS</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 320px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #a1a1aa; font-size: 14px; margin: 0; }
  button {
    margin-top: 20px;
    background: #f4f4f5;
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Life OS needs a connection to load your data. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
